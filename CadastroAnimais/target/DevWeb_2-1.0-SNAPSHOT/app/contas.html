<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contas</title>
    <link rel="stylesheet" href="https://unpkg.com/mvp.css">
</head>
<body>
    <header><nav id="menu"></nav></header>
    <main>
        <section>
            <p id="contexto"></p>
            <h2 id="titulo-form">Cadastrar conta</h2>
            <form id="form">
                <input type="hidden" id="id">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" maxlength="150" required>
                <label for="valor">Valor (R$):</label>
                <input type="number" id="valor" step="0.01" min="0" required>
                <label for="vencimento">Vencimento:</label>
                <input type="date" id="vencimento" required>
                <label for="situacao">Situação:</label>
                <select id="situacao">
                    <option value="PENDENTE">Pendente</option>
                    <option value="PAGA">Paga</option>
                </select>
                <button type="submit" id="salvar">Adicionar</button>
                <button type="button" id="cancelar" hidden>Cancelar edição</button>
                <p id="msg" role="alert"></p>
            </form>
        </section>
        <hr>
        <section>
            <h2>Contas da minha empresa</h2>
            <p>Total pendente: <strong id="total">R$ 0,00</strong></p>
            <table>
                <thead><tr><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Situação</th><th></th></tr></thead>
                <tbody id="lista"></tbody>
            </table>
        </section>
    </main>
    <script src="../js/app.js"></script>
    <script>
        (async function () {
            var s = await App.exigirLogin(false);
            if (!s) return;
            var msg = document.getElementById('msg');
            var f = { id: document.getElementById('id'), descricao: document.getElementById('descricao'),
                      valor: document.getElementById('valor'), vencimento: document.getElementById('vencimento'),
                      situacao: document.getElementById('situacao') };

            function resetar() {
                f.id.value = f.descricao.value = f.valor.value = f.vencimento.value = '';
                f.situacao.value = 'PENDENTE';
                document.getElementById('titulo-form').textContent = 'Cadastrar conta';
                document.getElementById('salvar').textContent = 'Adicionar';
                document.getElementById('cancelar').hidden = true;
            }
            function editar(c) {
                f.id.value = c.id; f.descricao.value = c.descricao; f.valor.value = c.valor;
                f.vencimento.value = c.vencimento; f.situacao.value = c.situacao;
                document.getElementById('titulo-form').textContent = 'Editar conta';
                document.getElementById('salvar').textContent = 'Salvar alterações';
                document.getElementById('cancelar').hidden = false;
                window.scrollTo(0, 0);
            }

            async function carregar() {
                var tb = document.getElementById('lista');
                var lista = await App.api('GET', 'contas');
                App.limpar(tb);
                var total = 0;
                if (!lista.length) tb.appendChild(App.h('tr', null, App.h('td', { colspan: 5 }, 'Nenhuma conta cadastrada.')));
                lista.forEach(function (c) {
                    if (c.situacao === 'PENDENTE') total += Number(c.valor);
                    tb.appendChild(App.h('tr', null,
                        App.h('td', null, c.descricao),
                        App.h('td', null, App.moeda(c.valor)),
                        App.h('td', null, App.dataBR(c.vencimento)),
                        App.h('td', null, c.situacao === 'PAGA' ? 'Paga' : 'Pendente'),
                        App.h('td', null,
                            App.h('a', { href: '#', onclick: function (ev) { ev.preventDefault(); editar(c); } }, 'Editar'), ' | ',
                            App.h('a', { href: '#', onclick: async function (ev) {
                                ev.preventDefault();
                                if (!confirm('Excluir esta conta?')) return;
                                try { await App.api('DELETE', 'contas?id=' + c.id); carregar(); }
                                catch (e) { App.mensagem(msg, e.message, true); }
                            } }, 'Excluir'))));
                });
                document.getElementById('total').textContent = App.moeda(total);
            }

            document.getElementById('cancelar').addEventListener('click', resetar);
            document.getElementById('form').addEventListener('submit', async function (ev) {
                ev.preventDefault();
                try {
                    await App.api('POST', 'contas', { id: f.id.value, descricao: f.descricao.value, valor: f.valor.value,
                                                      vencimento: f.vencimento.value, situacao: f.situacao.value });
                    resetar();
                    App.mensagem(msg, 'Conta salva.', false);
                    carregar();
                } catch (e) { App.mensagem(msg, e.message, true); }
            });
            carregar();
        })();
    </script>
</body>
</html>
