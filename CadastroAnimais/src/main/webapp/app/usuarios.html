<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuários</title>
    <link rel="stylesheet" href="https://unpkg.com/mvp.css">
</head>
<body>
    <header><nav id="menu"></nav></header>
    <main>
        <section>
            <p id="contexto"></p>
            <h2 id="titulo-form">Cadastrar usuário</h2>
            <form id="form">
                <input type="hidden" id="id">
                <label for="login">Login:</label>
                <input type="text" id="login" maxlength="50" pattern="[A-Za-z0-9._-]{3,50}" required>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" maxlength="100" required>
                <label for="senha" id="rotulo-senha">Senha (mín. 6 caracteres):</label>
                <input type="password" id="senha" autocomplete="new-password">
                <fieldset>
                    <legend>Acesso por empresa (somente as que você administra)</legend>
                    <div id="empresas"></div>
                </fieldset>
                <button type="submit" id="salvar">Cadastrar</button>
                <button type="button" id="cancelar" hidden>Cancelar edição</button>
                <p id="msg" role="alert"></p>
            </form>
        </section>
        <hr>
        <section>
            <h2>Usuários das minhas empresas</h2>
            <table>
                <thead><tr><th>Login</th><th>Nome</th><th>Acesso</th><th></th></tr></thead>
                <tbody id="lista"></tbody>
            </table>
        </section>
    </main>
    <script src="../js/app.js"></script>
    <script>
        (async function () {
            var s = await App.exigirLogin(true);
            if (!s) return;
            var msg = document.getElementById('msg');
            var dados = { empresas: [], usuarios: [] };
            var selects = {}; // empresaId -> <select>
            var f = { id: document.getElementById('id'), login: document.getElementById('login'),
                      nome: document.getElementById('nome'), senha: document.getElementById('senha') };
            var perfis = { COMUM: 'Comum', ADMIN: 'Administrador' };

            function montarSelects() {
                var box = document.getElementById('empresas');
                App.limpar(box);
                selects = {};
                dados.empresas.forEach(function (e) {
                    var sel = App.h('select', { id: 'emp_' + e.id },
                        App.h('option', { value: '' }, '— sem acesso —'),
                        App.h('option', { value: 'COMUM' }, 'Usuário comum'),
                        App.h('option', { value: 'ADMIN' }, 'Administrador'));
                    selects[e.id] = sel;
                    box.appendChild(App.h('label', { 'for': 'emp_' + e.id }, e.nome));
                    box.appendChild(sel);
                });
            }

            function resetar() {
                f.id.value = f.login.value = f.nome.value = f.senha.value = '';
                f.login.disabled = false; f.nome.disabled = false; f.senha.disabled = false;
                f.senha.required = true;
                document.getElementById('titulo-form').textContent = 'Cadastrar usuário';
                document.getElementById('salvar').textContent = 'Cadastrar';
                document.getElementById('rotulo-senha').textContent = 'Senha (mín. 6 caracteres):';
                document.getElementById('cancelar').hidden = true;
                for (var id in selects) selects[id].value = '';
            }

            function editar(u) {
                resetar();
                f.id.value = u.id; f.login.value = u.login; f.nome.value = u.nome;
                f.login.disabled = true;
                f.senha.required = false;
                if (u.externo) { // pertence a empresa de outro administrador: só pode mexer nos vínculos
                    f.nome.disabled = true; f.senha.disabled = true;
                }
                document.getElementById('rotulo-senha').textContent = u.externo
                    ? 'Senha (indisponível: o usuário também pertence a outra empresa)'
                    : 'Nova senha (deixe em branco para manter):';
                u.vinculos.forEach(function (v) { if (selects[v.empresaId]) selects[v.empresaId].value = v.perfil; });
                document.getElementById('titulo-form').textContent = 'Editar usuário';
                document.getElementById('salvar').textContent = 'Salvar alterações';
                document.getElementById('cancelar').hidden = false;
                window.scrollTo(0, 0);
            }

            function nomeEmpresa(id) {
                for (var i = 0; i < dados.empresas.length; i++) if (dados.empresas[i].id === id) return dados.empresas[i].nome;
                return '?';
            }

            async function carregar() {
                dados = await App.api('GET', 'admin/usuarios');
                var emEdicao = f.id.value;
                if (!Object.keys(selects).length) montarSelects();
                var tb = document.getElementById('lista');
                App.limpar(tb);
                if (!dados.usuarios.length) tb.appendChild(App.h('tr', null, App.h('td', { colspan: 4 }, 'Nenhum outro usuário.')));
                dados.usuarios.forEach(function (u) {
                    var acesso = u.vinculos.map(function (v) { return nomeEmpresa(v.empresaId) + ' (' + perfis[v.perfil] + ')'; }).join(', ');
                    tb.appendChild(App.h('tr', null,
                        App.h('td', null, u.login), App.h('td', null, u.nome), App.h('td', null, acesso),
                        App.h('td', null,
                            App.h('a', { href: '#', onclick: function (ev) { ev.preventDefault(); editar(u); } }, 'Editar'), ' | ',
                            App.h('a', { href: '#', onclick: async function (ev) {
                                ev.preventDefault();
                                if (!confirm('Remover o acesso de ' + u.nome + ' às suas empresas?')) return;
                                try { await App.api('DELETE', 'admin/usuarios?id=' + u.id); resetar(); carregar(); }
                                catch (e) { App.mensagem(msg, e.message, true); }
                            } }, 'Remover'))));
                });
            }

            document.getElementById('cancelar').addEventListener('click', resetar);
            document.getElementById('form').addEventListener('submit', async function (ev) {
                ev.preventDefault();
                var corpo = { id: f.id.value, login: f.login.value, nome: f.nome.value, senha: f.senha.value };
                // inputs desabilitados não enviam valor: reenvia o que está no formulário
                for (var id in selects) corpo['v_' + id] = selects[id].value;
                try {
                    await App.api('POST', 'admin/usuarios', corpo);
                    var editando = !!f.id.value;
                    resetar();
                    App.mensagem(msg, editando ? 'Usuário atualizado.' : 'Usuário cadastrado.', false);
                    carregar();
                } catch (e) { App.mensagem(msg, e.message, true); }
            });

            await carregar();
            resetar();
        })();
    </script>
</body>
</html>
